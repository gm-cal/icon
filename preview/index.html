    const grid=document.querySelector('#grid'),query=document.querySelector('#query'),category=document.querySelector('#category'),variant=document.querySelector('#variant'),count=document.querySelector('#count');
    let mono=false;
    function render(){
      const q=query.value.trim().toLocaleLowerCase('ja');
      const rows=icons.filter(x=>(!category.value||x.category.id===category.value)&&(!q||[x.id,x.slug,x.name.ja,x.name.en,x.category.ja,...x.keywords.ja].join(' ').toLocaleLowerCase('ja').includes(q)));

    }
