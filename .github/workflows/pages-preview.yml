name: Deploy icon preview to Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-preview.yml'
      - 'pages/**'
      - 'catalog/**'
      - 'color/**'
      - 'monochrome/**'
      - 'tools/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate icon set
        run: npm run validate

      # GitHub Pages must be enabled once in:
      # Settings > Pages > Build and deployment > Source > GitHub Actions
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp pages/index.html _site/index.html
          cp -R catalog _site/catalog
          cp -R color _site/color
          cp -R monochrome _site/monochrome
          cp THIRD_PARTY_NOTICES.md _site/THIRD_PARTY_NOTICES.md
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
