name: Sync generated artifacts for PR 6

on:
  push:
    branches:
      - fix/ui-component-palette-icons
    paths:
      - '.github/workflows/sync-generated-pr6.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/ui-component-palette-icons

      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/sync-generated-pr6.yml

      - name: Synchronize generated artifacts
        run: node tools/sync-generated.mjs

      - name: Validate repository consistency
        run: node tools/validate.mjs

      - name: Verify distribution checksums
        run: sha256sum -c SHA256SUMS

      - name: Commit synchronized artifacts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Sync icon generated artifacts"
            git push origin HEAD:fix/ui-component-palette-icons
          fi
