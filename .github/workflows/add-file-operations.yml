name: Add file operations category

on:
  push:
    branches:
      - feature/file-operations-category
    paths:
      - '.github/workflows/add-file-operations.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feature/file-operations-category

      - name: Remove one-shot workflow from resulting commit
        run: rm .github/workflows/add-file-operations.yml

      - name: Add file operation renderer
        shell: bash
        run: |
          cat > tools/render-file-operation.mjs <<'TOOL'
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";
          import { fileURLToPath } from "node:url";

          const root = path.resolve(path.dirname(fileURLToPath(import.meta.url)), "..");
          const [operation, sourceLabel, targetLabel, variant = "color", output] = process.argv.slice(2);
          const operations = new Map([
            ["convert", "file-convert"],
            ["split", "file-split"],
            ["merge", "file-merge"],
          ]);

          function usage(message) {
            if (message) console.error(message);
            console.error("Usage: node tools/render-file-operation.mjs <convert|split|merge> <source> <target> [color|monochrome] [output.svg]");
            process.exit(2);
          }

          function validateLabel(label, name) {
            if (!label) usage(`${name} label is required.`);
            const chars = Array.from(label);
            if (chars.length < 1 || chars.length > 5) usage(`${name} label must be 1 to 5 characters.`);
            if (/[\u0000-\u001F\u007F]/u.test(label)) usage(`${name} label must not contain control characters.`);
          }

          function escapeXml(value) {
            return value
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&apos;");
          }

          function replaceSlot(svg, slot, value) {
            const escaped = escapeXml(value);
            const expression = new RegExp(`(<text\\b[^>]*data-uui-label-slot="${slot}"[^>]*>)([^<]*)(<\\/text>)`, "g");
            let count = 0;
            const result = svg.replace(expression, (_all, open, _old, close) => {
              count += 1;
              return `${open}${escaped}${close}`;
            });
            if (count === 0) throw new Error(`Template does not contain label slot: ${slot}`);
            return result;
          }

          if (!operations.has(operation)) usage("Unknown operation.");
          if (variant !== "color" && variant !== "monochrome") usage("Variant must be color or monochrome.");
          validateLabel(sourceLabel, "Source");
          validateLabel(targetLabel, "Target");

          const slug = operations.get(operation);
          const templatePath = path.join(root, variant, "file-operations", `${slug}.svg`);
          let svg = await readFile(templatePath, "utf8");
          svg = replaceSlot(svg, "source", sourceLabel);
          svg = replaceSlot(svg, "target", targetLabel);
          svg = svg.replace("<svg ", `<svg data-uui-derived-source="${escapeXml(sourceLabel)}" data-uui-derived-target="${escapeXml(targetLabel)}" `);

          if (output) {
            const outputPath = path.resolve(output);
            await mkdir(path.dirname(outputPath), { recursive: true });
            await writeFile(outputPath, svg, "utf8");
            console.log(outputPath);
          } else {
            process.stdout.write(svg);
          }
          TOOL

      - name: Add category AGENTS files
        shell: bash
        run: |
          mkdir -p color/file-operations monochrome/file-operations
          cat > /tmp/file-operations-agents.md <<'AGENTS'
          # File Operations category instructions

          This directory contains canonical file-operation icon templates for the `FOP` / `file-operations` category.

          ## Canonical icons

          Keep the category small. The canonical operation icons are:

          - `file-convert.svg` — one file format converted to another
          - `file-split.svg` — one file split into multiple files
          - `file-merge.svg` — multiple files merged into one file

          Do **not** add a new catalog icon only for a format pair such as `pdf-to-csv`, `xlsx-to-json`, or `docx-to-txt`. Those are derived instances of the canonical templates.

          ## Replaceable labels

          Format labels are SVG `<text>` elements marked with `data-uui-label-slot="source"` or `data-uui-label-slot="target"`.

          - Replace text content only; preserve the slot attribute and layout attributes.
          - 1–5 characters are supported. Common uppercase format abbreviations such as `PDF`, `CSV`, `XLSX`, `DOCX`, `JSON`, `TXT`, and `XML` are preferred.
          - Do not convert the label text to path geometry.
          - Dynamic label content is intentionally excluded from the canonical geometry hash. Changing only a label does not create a new icon identity.
          - Use `node tools/render-file-operation.mjs ...` to generate derived SVGs when possible.
          - Derived format-pair SVGs should normally be generated at build/runtime and should not be committed to this repository.

          ## Visual rules

          - Preserve the `24 × 24` viewBox, stroke width 2, round caps, and round joins.
          - The operation silhouette must remain understandable even when the small label text is unreadable at 16px.
          - Color and monochrome variants must share the same geometry and label-slot positions.
          - Monochrome uses `currentColor`; color uses the `FOP` category palette.
          - Labels are secondary information. Do not enlarge them enough to dominate the operation symbol.

          ## Metadata and validation

          - Category ID: `file-operations`
          - Category code: `FOP`
          - Preserve icon IDs and slugs once published.
          - Keep `<uui:template>` metadata and label-slot attributes intact.
          - After changing canonical geometry, synchronize catalog, sprites, previews, and `SHA256SUMS`, then run `node tools/validate.mjs` and `sha256sum -c SHA256SUMS`.
          AGENTS
          cp /tmp/file-operations-agents.md color/file-operations/AGENTS.md
          cp /tmp/file-operations-agents.md monochrome/file-operations/AGENTS.md

      - name: Generate category, icons, catalog, sprites and previews
        shell: bash
        run: |
          cat > /tmp/add-file-operations.mjs <<'NODE'
          import { createHash } from "node:crypto";
          import { access, readFile, writeFile } from "node:fs/promises";
          import path from "node:path";

          const root = process.cwd();
          const category = {
            id: "file-operations",
            code: "FOP",
            ja: "ファイル操作",
            en: "File operations",
            iconCount: 3,
            palette: {
              primary: "#334155",
              accent: "#0EA5E9",
              secondary: "#94A3B8",
            },
          };
          const version = "3.1.0";
          const read = (relative) => readFile(path.join(root, relative), "utf8");
          const write = (relative, content) => writeFile(path.join(root, relative), content, "utf8");
          const sha256 = (content) => createHash("sha256").update(content).digest("hex");

          function escapeXml(value) {
            return String(value)
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&apos;");
          }

          function geometryInner(svg) {
            const match = svg.match(/<g aria-hidden="true">\s*([\s\S]*?)\s*<\/g>\s*<\/svg>\s*$/);
            if (!match) throw new Error("Could not locate icon geometry group.");
            return match[1].trim();
          }

          function canonicalGeometry(svg) {
            return geometryInner(svg)
              .replace(/(<text\b[^>]*data-uui-label-slot="[^"]+"[^>]*>)[\s\S]*?(<\/text>)/g, "$1{LABEL}$2")
              .replace(/\s+(?:stroke|fill|data-uui-role)="[^"]*"/g, "")
              .replace(/>\s+</g, "><")
              .replace(/\s+/g, " ")
              .trim();
          }

          function geometryHash(svg) {
            return sha256(canonicalGeometry(svg));
          }

          function filePath(x, y, w, h) {
            const fold = 2.5;
            return `M${x} ${y}h${w - fold}l${fold} ${fold}v${h - fold}H${x}z`;
          }

          function foldPath(x, y, w) {
            const fold = 2.5;
            return `M${x + w - fold} ${y}v${fold}h${fold}`;
          }

          const definitions = [
            {
              id: "UUI-FOP-0001",
              slug: "file-convert",
              nameJa: "ファイル変換",
              nameEn: "File Convert",
              descriptionJa: "ファイル形式の変換を表すテンプレートアイコン。source/targetラベルを差し替えてXLSX→CSVなどを表現する。",
              descriptionEn: "Template icon for converting one file format to another. Replace the source and target label slots for combinations such as XLSX to CSV.",
              keywordsJa: ["ファイル変換", "変換", "コンバート", "形式変換", "ファイル操作", "source", "target"],
              keywordsEn: ["file convert", "conversion", "format", "file operations", "source", "target"],
              operation: "convert",
              geometry: ({ primary, accent, text }) => [
                `<path d="${filePath(1.5, 3, 8.5, 15.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(1.5, 3, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0001-label-source" x="5.75" y="11.7" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2.4" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="source" data-uui-label-max-length="5">SRC</text>`,
                `<path d="M10.8 11h2.7" stroke="${accent}" data-uui-role="accent"/>`,
                `<path d="m12.2 9.6 1.5 1.4-1.5 1.4" stroke="${accent}" data-uui-role="accent"/>`,
                `<path d="${filePath(14, 5.5, 8.5, 15.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(14, 5.5, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0001-label-target" x="18.25" y="14.2" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2.4" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="target" data-uui-label-max-length="5">DST</text>`,
              ],
            },
            {
              id: "UUI-FOP-0002",
              slug: "file-split",
              nameJa: "ファイル分割",
              nameEn: "File Split",
              descriptionJa: "1つのファイルを複数ファイルへ分割する操作を表すテンプレートアイコン。source/targetラベルを差し替えてPDF分割などを表現する。",
              descriptionEn: "Template icon for splitting one file into multiple files. Replace the source and target label slots for operations such as PDF splitting.",
              keywordsJa: ["ファイル分割", "分割", "split", "ファイル操作", "source", "target"],
              keywordsEn: ["file split", "split", "parts", "file operations", "source", "target"],
              operation: "split",
              geometry: ({ primary, accent, text }) => [
                `<path d="${filePath(1.5, 5, 8.5, 14.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(1.5, 5, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0002-label-source" x="5.75" y="12.2" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2.4" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="source" data-uui-label-max-length="5">SRC</text>`,
                `<path d="M10.7 12.2h2.1M12.8 12.2c1.4 0 1.2-5.2 2.8-5.2M12.8 12.2c1.4 0 1.2 5.2 2.8 5.2" stroke="${accent}" data-uui-role="accent"/>`,
                `<path d="${filePath(15.5, 2, 7, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(15.5, 2, 7)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0002-label-target-a" x="19" y="6.6" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="target" data-uui-label-max-length="5">DST</text>`,
                `<path d="${filePath(15.5, 13, 7, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(15.5, 13, 7)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0002-label-target-b" x="19" y="17.6" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="target" data-uui-label-max-length="5">DST</text>`,
              ],
            },
            {
              id: "UUI-FOP-0003",
              slug: "file-merge",
              nameJa: "ファイル統合",
              nameEn: "File Merge",
              descriptionJa: "複数ファイルを1つのファイルへ統合する操作を表すテンプレートアイコン。source/targetラベルを差し替えてPDF統合などを表現する。",
              descriptionEn: "Template icon for merging multiple files into one file. Replace the source and target label slots for operations such as PDF merging.",
              keywordsJa: ["ファイル統合", "統合", "結合", "merge", "ファイル操作", "source", "target"],
              keywordsEn: ["file merge", "merge", "combine", "file operations", "source", "target"],
              operation: "merge",
              geometry: ({ primary, accent, text }) => [
                `<path d="${filePath(1.5, 2, 7, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(1.5, 2, 7)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0003-label-source-a" x="5" y="6.6" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="source" data-uui-label-max-length="5">SRC</text>`,
                `<path d="${filePath(1.5, 13, 7, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(1.5, 13, 7)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0003-label-source-b" x="5" y="17.6" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="source" data-uui-label-max-length="5">SRC</text>`,
                `<path d="M8.7 7c1.6 0 1.4 5.2 2.8 5.2h2M8.7 17.4c1.6 0 1.4-5.2 2.8-5.2M12.1 10.8l1.5 1.4-1.5 1.4" stroke="${accent}" data-uui-role="accent"/>`,
                `<path d="${filePath(14, 5, 8.5, 14.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<path d="${foldPath(14, 5, 8.5)}" stroke="${primary}" data-uui-role="primary"/>`,
                `<text id="uui-fop-0003-label-target" x="18.25" y="12.2" text-anchor="middle" dominant-baseline="middle" font-family="monospace" font-size="2.4" font-weight="700" stroke="none" fill="${text}" data-uui-label-slot="target" data-uui-label-max-length="5">DST</text>`,
              ],
            },
          ];

          function buildSvg(definition, variant) {
            const monochrome = variant === "monochrome";
            const colors = monochrome
              ? { primary: "currentColor", accent: "currentColor", text: "currentColor" }
              : { primary: category.palette.primary, accent: category.palette.accent, text: category.palette.primary };
            const geometry = definition.geometry(colors);
            const temp = `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:uui="urn:universal-ui-icons:metadata:1.0" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="${definition.id.toLowerCase()}-${variant}-title ${definition.id.toLowerCase()}-${variant}-desc" data-icon-id="${definition.id}" data-icon-name="${definition.slug}" data-icon-variant="${variant}" data-icon-category="${category.id}" data-icon-category-code="${category.code}" data-uui-template="file-operation" data-uui-operation="${definition.operation}">\n  <title id="${definition.id.toLowerCase()}-${variant}-title" xml:lang="ja">${definition.nameJa}</title>\n  <desc id="${definition.id.toLowerCase()}-${variant}-desc" xml:lang="ja">${definition.descriptionJa}</desc>\n  <metadata id="uui-metadata">\n    <uui:icon schemaVersion="1.1" libraryVersion="${version}" id="${definition.id}" slug="${definition.slug}" variant="${variant}">\n      <uui:name xml:lang="ja">${definition.nameJa}</uui:name>\n      <uui:name xml:lang="en">${definition.nameEn}</uui:name>\n      <uui:description xml:lang="ja">${definition.descriptionJa}</uui:description>\n      <uui:description xml:lang="en">${definition.descriptionEn}</uui:description>\n      <uui:category id="${category.id}" code="${category.code}" xml:lang="ja">${category.ja}</uui:category>\n      <uui:category id="${category.id}" code="${category.code}" xml:lang="en">${category.en}</uui:category>\n      <uui:keywords xml:lang="ja">${definition.keywordsJa.join(", ")}</uui:keywords>\n      <uui:keywords xml:lang="en">${definition.keywordsEn.join(", ")}</uui:keywords>\n      <uui:recommendedSizes unit="px">16 20 24 32 48</uui:recommendedSizes>\n      <uui:minimumSize unit="px">20</uui:minimumSize>\n      <uui:opticalSize unit="px">24</uui:opticalSize>\n      <uui:contexts>button toolbar menu</uui:contexts>\n      <uui:pair variant="${monochrome ? "color" : "monochrome"}" href="../../${monochrome ? "color" : "monochrome"}/${category.id}/${definition.slug}.svg"/>\n      <uui:palette primary="${category.palette.primary}" accent="${category.palette.accent}" secondary="${category.palette.secondary}"/>\n      <uui:template kind="file-operation" operation="${definition.operation}" labelSlots="source target" labelMaxLength="5"/>\n      <uui:geometry viewBox="0 0 24 24" strokeWidth="2" sha256="__GEOMETRY_HASH__"/>\n      <uui:source project="Universal UI Icons" version="${version}" license="Project" modified="false"/>\n    </uui:icon>\n  </metadata>\n  <g aria-hidden="true">\n${geometry.map((line) => `    ${line}`).join("\n")}\n  </g>\n</svg>\n`;
            const hash = geometryHash(temp);
            return temp.replace("__GEOMETRY_HASH__", hash);
          }

          const catalog = JSON.parse(await read("catalog/catalog-v1.json"));
          const prototype = catalog.icons.find((icon) => icon.slug === "ui-file-picker") ?? catalog.icons.at(-1);
          if (!prototype) throw new Error("Could not locate catalog prototype icon.");

          catalog.categories = catalog.categories.filter((item) => item.id !== category.id && item.code !== category.code);
          catalog.icons = catalog.icons.filter((item) => item.category?.id !== category.id);
          catalog.categories.push(category);

          for (const definition of definitions) {
            const colorSvg = buildSvg(definition, "color");
            const monoSvg = buildSvg(definition, "monochrome");
            const colorHash = geometryHash(colorSvg);
            const monoHash = geometryHash(monoSvg);
            if (colorHash !== monoHash) throw new Error(`Color/monochrome geometry mismatch: ${definition.slug}`);
            await write(`color/${category.id}/${definition.slug}.svg`, colorSvg);
            await write(`monochrome/${category.id}/${definition.slug}.svg`, monoSvg);

            const icon = structuredClone(prototype);
            delete icon.legacyId;
            icon.id = definition.id;
            icon.slug = definition.slug;
            icon.name = { ...icon.name, ja: definition.nameJa, en: definition.nameEn };
            icon.category = { ...icon.category, id: category.id, code: category.code, ja: category.ja, en: category.en };
            icon.description = { ...icon.description, ja: definition.descriptionJa, en: definition.descriptionEn };
            icon.keywords = { ...icon.keywords, ja: definition.keywordsJa, en: definition.keywordsEn };
            icon.files = {
              color: `color/${category.id}/${definition.slug}.svg`,
              monochrome: `monochrome/${category.id}/${definition.slug}.svg`,
            };
            icon.minimumSizePx = 20;
            icon.geometrySha256 = colorHash;
            if (icon.source) icon.source = { ...icon.source, project: "Universal UI Icons", version, license: "Project", modified: false };
            if (icon.palette) icon.palette = { ...category.palette };
            catalog.icons.push(icon);
          }

          catalog.library.version = version;
          catalog.library.iconCount = catalog.icons.length;
          catalog.library.svgCount = catalog.icons.length * 2;
          category.iconCount = definitions.length;

          function csvCell(value) {
            return `"${String(value ?? "").replaceAll('"', '""')}"`;
          }

          function buildCsv(data) {
            const headers = [
              "id", "legacy_id", "slug", "name_ja", "name_en", "category_id", "category_code",
              "category_ja", "description_ja", "color_file", "monochrome_file",
              "recommended_sizes_px", "minimum_size_px", "geometry_sha256",
            ];
            const rows = [headers.map(csvCell).join(",")];
            for (const icon of data.icons) {
              rows.push([
                icon.id,
                icon.legacyId ?? "",
                icon.slug,
                icon.name.ja,
                icon.name.en,
                icon.category.id,
                icon.category.code,
                icon.category.ja,
                icon.description.ja,
                icon.files.color,
                icon.files.monochrome,
                icon.recommendedSizesPx.join("|"),
                icon.minimumSizePx,
                icon.geometrySha256,
              ].map(csvCell).join(","));
            }
            return `\uFEFF${rows.join("\n")}\n`;
          }

          async function buildSprite(data, variant) {
            const lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<svg xmlns="http://www.w3.org/2000/svg">',
              '  <defs>',
            ];
            for (const icon of data.icons) {
              const svg = await read(icon.files[variant]);
              lines.push(`    <symbol id="uui-${icon.slug}" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`);
              lines.push(`      <title xml:lang="ja">${escapeXml(icon.name.ja)}</title>`);
              for (const line of geometryInner(svg).split(/\r?\n/)) lines.push(`      ${line.trim()}`);
              lines.push("    </symbol>");
            }
            lines.push("  </defs>", "</svg>", "");
            return lines.join("\n");
          }

          async function buildCategoryPreview(data, variant) {
            const icons = data.icons.filter((icon) => icon.category.id === category.id);
            const monochrome = variant === "monochrome";
            const width = 840;
            const height = 208;
            const lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"${monochrome ? ' color="#1F2937"' : ""}>`,
              '  <rect width="100%" height="100%" fill="#F8FAFC"/>',
              `  <text x="24" y="34" font-size="22" font-weight="700" fill="#0F172A">${category.ja} — ${monochrome ? "モノクロ版" : "カラー版"}</text>`,
              `  <text x="24" y="57" font-size="12" fill="#64748B">${category.en} · ${icons.length} icons</text>`,
            ];
            for (let index = 0; index < icons.length; index += 1) {
              const icon = icons[index];
              const x = index * 168;
              const y = 76;
              const svg = await read(icon.files[variant]);
              lines.push(`    <g transform="translate(${x} ${y})">`);
              lines.push('      <rect x="8" y="8" width="152" height="116" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>');
              lines.push('      <g transform="translate(60 22) scale(2)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">');
              for (const line of geometryInner(svg).split(/\r?\n/)) lines.push(`        ${line.trim()}`);
              lines.push("      </g>");
              lines.push(`      <text x="84" y="91" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">${escapeXml(icon.name.ja)}</text>`);
              lines.push(`      <text x="84" y="110" text-anchor="middle" font-size="10" fill="#6B7280">${escapeXml(icon.id)} · ${escapeXml(icon.slug)}</text>`);
              lines.push("    </g>");
            }
            lines.push("</svg>", "");
            return lines.join("\n");
          }

          function replaceEmbeddedIconCatalog(html, icons) {
            const marker = "const icons=";
            const markerIndex = html.indexOf(marker);
            if (markerIndex < 0) throw new Error("preview/index.html: const icons marker not found.");
            const start = html.indexOf("[", markerIndex + marker.length);
            if (start < 0) throw new Error("preview/index.html: icons array start not found.");
            let depth = 0;
            let inString = false;
            let escaped = false;
            for (let i = start; i < html.length; i += 1) {
              const ch = html[i];
              if (inString) {
                if (escaped) escaped = false;
                else if (ch === "\\") escaped = true;
                else if (ch === '"') inString = false;
                continue;
              }
              if (ch === '"') { inString = true; continue; }
              if (ch === "[") depth += 1;
              else if (ch === "]") {
                depth -= 1;
                if (depth === 0) return html.slice(0, start) + JSON.stringify(icons) + html.slice(i + 1);
              }
            }
            throw new Error("preview/index.html: icons array end not found.");
          }

          await write("catalog/catalog-v1.json", `${JSON.stringify(catalog, null, 2)}\n`);
          await write("catalog/catalog-v1.csv", buildCsv(catalog));
          await write("sprites/color.svg", await buildSprite(catalog, "color"));
          await write("sprites/monochrome.svg", await buildSprite(catalog, "monochrome"));
          await write("preview/categories/file-operations-color.svg", await buildCategoryPreview(catalog, "color"));
          await write("preview/categories/file-operations-monochrome.svg", await buildCategoryPreview(catalog, "monochrome"));
          const previewHtml = await read("preview/index.html");
          await write("preview/index.html", replaceEmbeddedIconCatalog(previewHtml, catalog.icons));

          let categoryCodes = await read("docs/CATEGORY-CODES.md");
          if (!categoryCodes.includes("`FOP` | `file-operations`")) {
            const row = "| `FOP` | `file-operations` | ファイル操作 | 3 | `UUI-FOP-0001`〜`UUI-FOP-0003` |";
            const anchor = "\nv2.0.0以前の全体連番ID";
            if (!categoryCodes.includes(anchor)) throw new Error("CATEGORY-CODES insertion anchor not found.");
            categoryCodes = categoryCodes.replace(anchor, `\n${row}\n${anchor}`);
            await write("docs/CATEGORY-CODES.md", categoryCodes);
          }

          let readme = await read("README.md");
          const replacements = [
            ["1,025種類の各アイコンについてカラー版とモノクロ版を1点ずつ、合計2,050 SVG", "1,028種類の各アイコンについてカラー版とモノクロ版を1点ずつ、合計2,056 SVG"],
            ["- 42分類、合計1,025種類", "- 43分類、合計1,028種類"],
            ["- v3.0.0ではカテゴリコード付きIDへ移行し、チェックボックス、ラジオボタン、プルダウンなどUI部品25種を追加", "- v3.0.0ではカテゴリコード付きIDへ移行し、チェックボックス、ラジオボタン、プルダウンなどUI部品25種を追加\n- v3.1.0ではファイル操作カテゴリを追加し、文字差し替え可能な変換・分割・統合テンプレート3種を追加"],
            ["命名規則3種とUI部品25種は独自形状です。", "命名規則3種、UI部品25種、ファイル操作3種は独自形状です。"],
            ["├─ color/                 カラー版（1,025 SVG）", "├─ color/                 カラー版（1,028 SVG）"],
            ["├─ monochrome/            モノクロ版（1,025 SVG）", "├─ monochrome/            モノクロ版（1,028 SVG）"],
            ["- アイコンセット: 3.0.0", "- アイコンセット: 3.1.0"],
            ["- 最終更新: 2026-09-07", "- 最終更新: 2026-09-08"],
          ];
          for (const [from, to] of replacements) {
            if (!readme.includes(from)) throw new Error(`README replacement anchor missing: ${from}`);
            readme = readme.replace(from, to);
          }
          if (!readme.includes("### 3.1.0での変更")) {
            const section = `\n### 3.1.0での変更\n\n- \`FOP\` / \`file-operations\`（ファイル操作）カテゴリを追加\n- \`UUI-FOP-0001\` \`file-convert\`、\`UUI-FOP-0002\` \`file-split\`、\`UUI-FOP-0003\` \`file-merge\` を追加\n- source / target の文字ラベルを差し替えてPDF→CSV、XLSX→JSON等を派生生成できるテンプレート構造を採用\n- 派生SVGをカタログへ量産せず、\`tools/render-file-operation.mjs\` で必要時に生成する方針を追加\n`;
            const anchor = "\n### 3.0.0での変更";
            if (!readme.includes(anchor)) throw new Error("README changelog insertion anchor not found.");
            readme = readme.replace(anchor, `${section}${anchor}`);
          }
          await write("README.md", readme);

          async function exists(relative) {
            try { await access(path.join(root, relative)); return true; }
            catch { return false; }
          }

          async function refreshChecksums() {
            const current = await read("SHA256SUMS");
            const paths = current.split(/\r?\n/)
              .map((line) => line.match(/^[0-9a-f]{64}  (.+)$/)?.[1])
              .filter(Boolean);
            const additions = [
              "README.md",
              "docs/CATEGORY-CODES.md",
              "tools/render-file-operation.mjs",
              "color/file-operations/AGENTS.md",
              "color/file-operations/file-convert.svg",
              "color/file-operations/file-split.svg",
              "color/file-operations/file-merge.svg",
              "monochrome/file-operations/AGENTS.md",
              "monochrome/file-operations/file-convert.svg",
              "monochrome/file-operations/file-split.svg",
              "monochrome/file-operations/file-merge.svg",
              "preview/categories/file-operations-color.svg",
              "preview/categories/file-operations-monochrome.svg",
            ];
            for (const relative of additions) if (!paths.includes(relative)) paths.push(relative);
            paths.sort((a, b) => a.localeCompare(b, "en"));
            const output = [];
            for (const relative of paths) {
              if (!await exists(relative)) continue;
              const bytes = await readFile(path.join(root, relative));
              output.push(`${sha256(bytes)}  ${relative}`);
            }
            await write("SHA256SUMS", `${output.join("\n")}\n`);
          }

          await refreshChecksums();
          console.log(`Added ${category.id}: ${definitions.length} icons; total ${catalog.icons.length} icons / ${catalog.categories.length} categories.`);
          NODE
          node /tmp/add-file-operations.mjs

      - name: Validate repository consistency
        run: node tools/validate.mjs

      - name: Verify distribution checksums
        run: sha256sum -c SHA256SUMS

      - name: Smoke-test replaceable labels
        shell: bash
        run: |
          node tools/render-file-operation.mjs convert XLSX CSV color /tmp/xlsx-to-csv.svg
          grep -q '>XLSX</text>' /tmp/xlsx-to-csv.svg
          grep -q '>CSV</text>' /tmp/xlsx-to-csv.svg
          node tools/render-file-operation.mjs split PDF PDF monochrome /tmp/pdf-split.svg
          grep -q 'data-uui-label-slot="source">PDF</text>' /tmp/pdf-split.svg

      - name: Commit generated category
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add templated file operations icon category"
          git push origin HEAD:feature/file-operations-category
